name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: 核心模块（零第三方依赖断言 + vet + test）
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./...
          echo "go list -m all（应仅含本模块）:"
          go list -m all
      - name: TUI 模块（vet + race test + build）
        working-directory: tui
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -trimpath -ldflags="-s -w" -o downloader-tui.exe ./cmd/downloader-tui
      - name: MCP 模块（vet + race test + build）
        working-directory: mcp
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -trimpath -ldflags="-s -w" -o downloader-mcp.exe ./cmd/downloader-mcp

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          for app in cmd/downloader mcp/cmd/downloader-mcp; do
            name=$(basename $app)
            go build -trimpath -ldflags="-s -w" -o "dist/${name}-${GOOS}-${GOARCH}${ext}" ./${app}
          done
        shell: bash
      - name: upload
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
