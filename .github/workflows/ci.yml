name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read # 供应链最小权限；release 任务按需声明 contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: 核心模块（零第三方依赖断言 + vet + test）
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./...
          echo "go list -m all（应仅含本模块）:"
          go list -m all
      - name: 合规检查（scripts/compliance.sh）
        run: bash scripts/compliance.sh
      - name: TUI 模块（vet + race test + build）
        working-directory: tui
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -trimpath -ldflags="-s -w" -o porter-tui.exe ./cmd/porter-tui
      - name: MCP 模块（vet + race test + build）
        working-directory: mcp
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -trimpath -ldflags="-s -w" -o porter-mcp.exe ./cmd/porter-mcp

  vulncheck:
    # 供应链合规：官方漏洞库比对（标准库 + tui/mcp 第三方依赖）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: 安装 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: 核心模块
        run: govulncheck ./...
      - name: TUI 模块
        working-directory: tui
        run: govulncheck ./...
      - name: MCP 模块
        working-directory: mcp
        run: govulncheck ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          # 各包在所属 module 目录内构建（mcp/tui 为独立 module）
          go build -trimpath -ldflags="-s -w" -o "dist/porter-${GOOS}-${GOARCH}${ext}" ./cmd/porter
          ( cd tui && go build -trimpath -ldflags="-s -w" -o "../dist/porter-tui-${GOOS}-${GOARCH}${ext}" ./cmd/porter-tui )
          ( cd mcp && go build -trimpath -ldflags="-s -w" -o "../dist/porter-mcp-${GOOS}-${GOARCH}${ext}" ./cmd/porter-mcp )
        shell: bash
      - name: upload
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
